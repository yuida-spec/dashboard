<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1b18" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>プロジェクト・ダッシュボード</title>
<style>
:root{--bg:#faf9f5;--card:#fff;--ink:#23211c;--mut:#6b6862;--line:#e7e4dc;
--red:#c0392b;--redbg:#fadbd8;--amber:#b7950b;--amberbg:#fcf3cf;--green:#1e8449;--greenbg:#d5f5e3;--gray:#7f8c8d;--graybg:#eaecee;
--accent:#2c3e50;--col:#f3f1ea;--shadow:0 1px 3px rgba(0,0,0,.06);}
@media(prefers-color-scheme:dark){:root{--bg:#1c1b18;--card:#26241f;--ink:#ece9e1;--mut:#9b978d;--line:#36342d;
--redbg:#3a1e1a;--amberbg:#322a12;--greenbg:#16301f;--graybg:#2a2c2d;--accent:#cdd6df;--col:#222019;--shadow:0 1px 3px rgba(0,0,0,.3);}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100dvh}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;font-size:15px;line-height:1.6;touch-action:manipulation}
button{font-family:inherit;cursor:pointer}
button:active{transform:scale(.97)}
.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- lock ---- */
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);z-index:50}
.lockbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.lockbox h1{font-size:18px;margin:0 0 4px}
.lockbox p{font-size:13px;color:var(--mut);margin:0 0 16px}
.lockbox label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.lockbox input{width:100%;height:46px;padding:0 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.lockbox textarea{width:100%;min-height:64px;padding:10px 12px;font-size:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
.btn{width:100%;height:46px;margin-top:16px;border:none;border-radius:10px;background:var(--accent);color:var(--bg);font-size:15px;font-weight:600}
.btn.sub{background:transparent;color:var(--mut);border:1px solid var(--line);height:42px;font-weight:400;font-size:13px;margin-top:8px}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
.hint{font-size:12px;color:var(--mut);margin-top:10px;line-height:1.5}

/* ---- header ---- */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px calc(8px);padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header .ttl{font-size:16px;font-weight:600;white-space:nowrap}
header .dt{font-size:13px;color:var(--mut);font-weight:400}
header .grow{flex:1}
.chips{display:flex;gap:5px;align-items:center}
.chip{font-size:11.5px;padding:2px 9px;border-radius:20px;white-space:nowrap}
.chip.red{background:var(--redbg);color:var(--red)}
.chip.amber{background:var(--amberbg);color:var(--amber)}
.chip.green{background:var(--greenbg);color:var(--green)}
.status{font-size:11.5px;color:var(--mut);display:flex;align-items:center;gap:4px;white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gray)}
.status.dirty::before{background:var(--amber)}.status.ok::before{background:var(--green)}.status.err::before{background:var(--red)}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;min-height:38px;min-width:38px;padding:0 10px;font-size:14px}

/* ---- today bar ---- */
#todaybar{margin:12px 14px 0;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:0 12px 12px 0;padding:10px 14px;box-shadow:var(--shadow)}
#todaybar .tbh{font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:2px;display:flex;align-items:center;gap:6px}
#todaybar ul{margin:0;padding:0;list-style:none}
#todaybar li{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer;min-height:40px}
#todaybar li:first-child{border-top:none}
#todaybar .tstar{color:var(--red);flex:none;font-size:13px}
#todaybar .ttl2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#todaybar .from{font-size:11px;color:var(--mut);background:var(--bg);padding:2px 9px;border-radius:20px;white-space:nowrap;flex:none}
#todaybar .d{font-size:12px;color:var(--mut);white-space:nowrap;flex:none}
#todaybar .d.over{color:var(--red);font-weight:600}
#todaybar .none{color:var(--mut);font-size:13.5px;padding:4px 0 2px}

/* ---- board ---- */
#board{display:flex;gap:14px;padding:14px 14px calc(40px + env(safe-area-inset-bottom));overflow-x:auto;align-items:flex-start}
.col{background:var(--col);border-radius:14px;padding:10px;width:290px;flex:0 0 290px}
.colhead{display:flex;align-items:center;gap:4px;margin:2px 2px 8px}
.colgrip{cursor:grab;color:var(--mut);opacity:.45;font-size:16px;flex:none;padding:6px 4px;touch-action:none;border-radius:6px}
.colgrip:active{cursor:grabbing}
.colname{flex:1;font-size:14px;font-weight:600;color:var(--mut);outline:none;border-radius:6px;padding:4px;min-width:0}
.colname:focus{background:var(--card);color:var(--ink)}
.ccount{font-size:11px;background:var(--card);color:var(--mut);border-radius:20px;padding:1px 8px;flex:none}
.xbtn{border:none;background:transparent;color:var(--mut);font-size:16px;line-height:1;padding:8px;border-radius:8px;opacity:.5;flex:none}
.xbtn:hover{opacity:1;color:var(--red)}
.cardlist{min-height:30px;border-radius:10px}
.cardlist:empty{border:1.5px dashed var(--line);min-height:52px;position:relative}
.cardlist:empty::after{content:"ここにドラッグ or 下から追加";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--mut);opacity:.7}

/* ---- card ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:9px;border-left:4px solid var(--gray);box-shadow:var(--shadow);transition:box-shadow .2s}
.card.green{border-left-color:var(--green)}.card.amber{border-left-color:var(--amber)}.card.red{border-left-color:var(--red)}.card.gray{border-left-color:var(--gray)}
.card{touch-action:pan-y}
.cardhead{display:flex;align-items:center;gap:6px}
.mname{flex:1;font-size:14.5px;font-weight:600;outline:none;border-radius:6px;padding:4px 4px;min-width:0}
.mname:focus{background:var(--bg)}
.pill{font-size:11px;padding:4px 10px;border-radius:20px;white-space:nowrap;user-select:none;border:none;font-weight:500}
.card.green .pill{background:var(--greenbg);color:var(--green)}.card.amber .pill{background:var(--amberbg);color:var(--amber)}.card.red .pill{background:var(--redbg);color:var(--red)}.card.gray .pill{background:var(--graybg);color:var(--gray)}
.prog{height:3px;border-radius:2px;background:var(--line);margin:6px 0 2px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--green);border-radius:2px;transition:width .25s ease-out}
.todos{list-style:none;margin:4px 0 0;padding:0}
.td{display:flex;align-items:center;gap:6px;font-size:13.5px;padding:2px 0;min-height:38px}
.ck{flex:none;width:19px;height:19px;cursor:pointer;accent-color:var(--green)}
.ttext{flex:1;outline:none;border-radius:6px;padding:4px;word-break:break-word;min-width:0}
.ttext:focus{background:var(--bg)}
.ttext:empty::before{content:"やることを入力…";color:var(--mut);opacity:.6}
.td.done .ttext{color:var(--mut);text-decoration:line-through}
.flag{flex:none;font-size:15px;color:var(--line);user-select:none;border:none;background:transparent;padding:6px 3px}
.flag.on{color:var(--red)}
.due{font-size:11px;color:var(--mut);white-space:nowrap;border:1px dashed var(--line);border-radius:7px;padding:4px 7px;background:transparent;flex:none}
.due.set{border-style:solid}
.due.today{color:var(--amber);border-color:var(--amber);font-weight:600}
.due.over{color:var(--red);border-color:var(--red);font-weight:600}
.tdx{flex:none;border:none;background:transparent;color:var(--mut);opacity:.4;font-size:14px;padding:7px 5px}
.tdx:hover{opacity:1;color:var(--red)}
.donetoggle{margin-top:4px;font-size:11.5px;color:var(--mut);background:transparent;border:none;padding:5px 4px;border-radius:6px;text-align:left}
.donetoggle:hover{background:var(--bg)}
.addtodo{margin-top:5px;font-size:12.5px;color:var(--mut);background:transparent;border:1.5px dashed var(--line);border-radius:8px;padding:7px 8px;width:100%;min-height:38px}
.addtodo:hover{background:var(--bg)}
.addcard{width:100%;margin-top:4px;font-size:13px;color:var(--mut);background:transparent;border:none;border-radius:8px;padding:9px;text-align:left;min-height:40px}
.addcard:hover{background:var(--card)}
.addcol{flex:0 0 230px;background:transparent;border:1.5px dashed var(--line);border-radius:14px;color:var(--mut);font-size:14px;padding:14px;min-height:56px}
.sortghost{opacity:.35}
.sortchosen{box-shadow:0 8px 22px rgba(0,0,0,.2)}
@keyframes cardflash{0%,100%{background:var(--card)}40%{background:var(--amberbg)}}
.flash{animation:cardflash 1.1s ease-out 2}

/* ---- modal ---- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
.modalbox{width:100%;max-width:400px;background:var(--card);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.modalbox h2{font-size:16px;margin:0 0 12px}
.modalbox label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.modalbox input{width:100%;height:44px;padding:0 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.modalbox .row{display:flex;gap:8px;margin-top:16px}
.modalbox .row .btn{margin-top:0}
#dueInput{position:fixed;opacity:0;pointer-events:none;width:1px;height:1px;left:-9999px}

/* ---- mobile: vertical stack ---- */
@media(max-width:640px){
  header{padding-left:12px;padding-right:12px}
  header .ttl{font-size:15px}
  .chips{order:5;width:100%;margin-top:2px}
  #todaybar{margin:10px 10px 0}
  #board{flex-direction:column;overflow-x:visible;gap:12px;padding:12px 10px calc(40px + env(safe-area-inset-bottom))}
  .col{width:100%;flex:none}
  .addcol{flex:none;width:100%}
  .mname{font-size:16px}
  .ttext{font-size:16px}
  .td{min-height:44px}
  .due{font-size:12px;padding:5px 8px}
}
</style>
</head>
<body>

<div id="lock">
  <div class="lockbox">
    <h1 id="lockTitle">ロック中</h1>
    <p id="lockDesc">合言葉を入力してください。</p>
    <div id="passWrap">
      <label>合言葉（パスフレーズ）</label>
      <input id="pass" type="password" autocomplete="off" inputmode="text">
    </div>
    <div id="pass2Wrap" class="hidden">
      <label>合言葉（確認のためもう一度）</label>
      <input id="pass2" type="password" autocomplete="off">
    </div>
    <div id="tokenWrap" class="hidden">
      <label>GitHub アクセストークン（初回のみ）</label>
      <textarea id="token" placeholder="github_pat_..."></textarea>
      <div class="hint" id="tokenHint"></div>
    </div>
    <button class="btn" id="unlockBtn">開く</button>
    <div class="err" id="lockErr"></div>
  </div>
</div>

<header class="hidden" id="hdr">
  <span class="ttl">ダッシュボード <span class="dt" id="hdrDate"></span></span>
  <span class="chips" id="chips"></span>
  <span class="grow"></span>
  <span class="status" id="status"></span>
  <button class="iconbtn" id="refreshBtn" title="最新を取得" aria-label="最新を取得">&#8635;</button>
  <button class="iconbtn" id="settingsBtn" aria-label="設定">設定</button>
</header>

<div id="todaybar" class="hidden"></div>
<div id="board" class="hidden"></div>
<input type="date" id="dueInput" tabindex="-1" aria-hidden="true">

<div id="modal" class="hidden">
  <div class="modalbox">
    <h2>設定</h2>
    <label>GitHub アクセストークン（更新する場合のみ入力）</label>
    <input id="mToken" type="password" placeholder="変更しない場合は空のまま">
    <label>合言葉を変更（新しい合言葉。空なら変更なし）</label>
    <input id="mPass" type="password" placeholder="変更しない場合は空のまま">
    <div class="row">
      <button class="btn sub" id="mCancel" style="margin-top:0">閉じる</button>
      <button class="btn" id="mSave">保存</button>
    </div>
    <div class="err" id="mErr"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js"></script>
<script>
const REPO="yuida-spec/dashboard";
const API="https://api.github.com/repos/"+REPO;
const ITER=150000;
const STATUSES=["green","amber","red","gray"];
const SLABEL={green:"順調",amber:"詰まり",red:"要対応",gray:"様子見"};

function id(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function $(s){return document.querySelector(s)}

const DEFAULT_DATA={columns:[
 {id:id(),name:"エイトハンドレッド / マクロミル",cards:[
   {id:id(),name:"マクロミル営業改革",status:"amber",todos:[
     {id:id(),text:"佐々木社長向けたたき台を仕上げる",done:false,pri:true,due:"7/3"},
     {id:id(),text:"関与50%・月250万フィーの条件を文面で確認",done:false,pri:false,due:""}]}]},
 {id:id(),name:"AIコンサル",cards:[
   {id:id(),name:"ダスキン",status:"green",todos:[{id:id(),text:"提案書ドラフトを送付",done:false,pri:false,due:""}]},
   {id:id(),name:"大善",status:"green",todos:[{id:id(),text:"次回ミーティングの日程調整",done:false,pri:false,due:""}]},
   {id:id(),name:"宣伝会議",status:"green",todos:[{id:id(),text:"請求書を発行",done:false,pri:false,due:""}]},
   {id:id(),name:"PEAK",status:"green",todos:[{id:id(),text:"月次レポートを共有",done:false,pri:false,due:""}]}]},
 {id:id(),name:"サンダー",cards:[
   {id:id(),name:"インフ",status:"green",todos:[{id:id(),text:"要件ヒアリングを実施",done:false,pri:false,due:""}]}]},
 {id:id(),name:"LMC",cards:[
   {id:id(),name:"マクアケ",status:"amber",todos:[{id:id(),text:"ページ構成案を作る",done:false,pri:true,due:""}]},
   {id:id(),name:"アフィリエイト",status:"amber",todos:[{id:id(),text:"ASPを選定",done:false,pri:false,due:""}]},
   {id:id(),name:"ビジネスケース",status:"green",todos:[{id:id(),text:"数値モデルを更新",done:false,pri:false,due:""}]}]}
]};

let state=null, KEY=null, TOKEN=null, SALT=null, SHA=null, saveTimer=null, isNew=false;
const openDone=new Set();

/* ===== crypto & sync (unchanged, tested) ===== */
function bytesToB64(bytes){let s="";for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s)}
function b64ToBytes(b64){const s=atob(b64.replace(/\s/g,""));const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function strToB64(str){return bytesToB64(new TextEncoder().encode(str))}
function b64ToStr(b64){return new TextDecoder().decode(b64ToBytes(b64))}
async function deriveKey(pass,salt){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function encStr(key,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj))));
  return bytesToB64(iv)+"."+bytesToB64(ct);
}
async function decStr(key,str){
  const p=str.split(".");
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBytes(p[0])},key,b64ToBytes(p[1]));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function ghGetVault(auth){
  const h={"Accept":"application/vnd.github+json"};
  if(auth&&TOKEN)h["Authorization"]="Bearer "+TOKEN;
  const r=await fetch(API+"/contents/vault.json?ref=main&t="+Date.now(),{headers:h,cache:"no-store"});
  if(r.status===404)return null;
  if(!r.ok)throw new Error("読込失敗("+r.status+")");
  const j=await r.json();
  SHA=j.sha;
  return JSON.parse(b64ToStr(j.content));
}
async function putRaw(vault){
  const body={message:"update dashboard",content:strToB64(JSON.stringify(vault)),branch:"main"};
  if(SHA)body.sha=SHA;
  return fetch(API+"/contents/vault.json",{method:"PUT",headers:{"Authorization":"Bearer "+TOKEN,"Accept":"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
}
async function ghPutVault(vault){
  let r=await putRaw(vault);
  if(r.status===409){await ghGetVault(true);r=await putRaw(vault);}
  if(!r.ok){let m="";try{m=(await r.json()).message||""}catch(e){} throw new Error("保存失敗("+r.status+") "+m)}
  SHA=(await r.json()).content.sha;
}
async function buildVault(){
  return {salt:bytesToB64(SALT), data:await encStr(KEY,state), token:await encStr(KEY,TOKEN)};
}
function setStatus(t,cls){const s=$("#status");s.textContent=t;s.className="status"+(cls?" "+cls:"")}
function markDirty(){setStatus("未保存","dirty");clearTimeout(saveTimer);saveTimer=setTimeout(save,1400)}
async function save(){
  if(!KEY||!TOKEN)return;
  setStatus("保存中…");
  try{await ghPutVault(await buildVault());setStatus("保存済み","ok")}
  catch(e){setStatus("保存エラー","err");console.error(e);alert("保存に失敗しました: "+e.message)}
}

/* ===== dates ===== */
function todayMD(){const d=new Date();return [d.getMonth()+1,d.getDate()]}
function dueCmp(due){ // -1 過去 / 0 今日 / 1 未来 / null 無し
  if(!due)return null;const m=due.match(/^(\d{1,2})\/(\d{1,2})$/);if(!m)return null;
  const t=todayMD();const a=(+m[1])*100+(+m[2]);const b=t[0]*100+t[1];
  return a<b?-1:(a===b?0:1);
}
function dueClass(due){const c=dueCmp(due);return c===-1?" over":(c===0?" today":"")}
function dueLabel(due){const c=dueCmp(due);if(c===-1)return due+"（期限切れ）";if(c===0)return due+"（今日）";return due}

/* ===== mutations always go through change() ===== */
function change(){render();markDirty()}

/* ===== today bar & chips ===== */
function collectPriorities(){
  const items=[];
  state.columns.forEach(col=>col.cards.forEach(card=>card.todos.forEach(td=>{
    if(td.done)return;
    const c=dueCmp(td.due);
    if(td.pri||c===-1||c===0)items.push({card,td,over:c===-1,today:c===0});
  })));
  items.sort((x,y)=>{
    const dx=x.td.due?dueCmp(x.td.due):2, dy=y.td.due?dueCmp(y.td.due):2;
    return dx-dy;
  });
  return items;
}
function renderToday(){
  const bar=$("#todaybar");bar.innerHTML="";
  const items=collectPriorities();
  const h=document.createElement("div");h.className="tbh";h.textContent="★ 今日やること";bar.appendChild(h);
  if(!items.length){
    const p=document.createElement("div");p.className="none";p.textContent="最優先・期限切れなし。良い一日を。";bar.appendChild(p);return;
  }
  const ul=document.createElement("ul");
  items.slice(0,7).forEach(it=>{
    const li=document.createElement("li");
    const s=document.createElement("span");s.className="tstar";s.textContent="★";
    const t=document.createElement("span");t.className="ttl2";t.textContent=it.td.text||"（無題）";
    const f=document.createElement("span");f.className="from";f.textContent=it.card.name;
    li.append(s,t,f);
    if(it.td.due){const d=document.createElement("span");d.className="d"+(it.over?" over":"");d.textContent=dueLabel(it.td.due);li.appendChild(d)}
    li.addEventListener("click",()=>{
      const el=document.querySelector('.card[data-id="'+it.card.id+'"]');
      if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")}
    });
    ul.appendChild(li);
  });
  bar.appendChild(ul);
  if(items.length>7){const m=document.createElement("div");m.className="none";m.textContent="ほか "+(items.length-7)+" 件";bar.appendChild(m)}
}
function renderChips(){
  const counts={red:0,amber:0,green:0,gray:0};
  state.columns.forEach(c=>c.cards.forEach(card=>counts[card.status]++));
  const el=$("#chips");el.innerHTML="";
  [["red","要対応"],["amber","詰まり"],["green","順調"]].forEach(([k,label])=>{
    if(!counts[k])return;
    const s=document.createElement("span");s.className="chip "+k;s.textContent=label+" "+counts[k];el.appendChild(s);
  });
}

/* ===== board rendering ===== */
function eltodo(td,card){
  const li=document.createElement("li");li.className="td"+(td.done?" done":"");li.dataset.tid=td.id;
  const ck=document.createElement("input");ck.type="checkbox";ck.className="ck";ck.checked=td.done;ck.setAttribute("aria-label","完了");
  ck.addEventListener("change",()=>{td.done=ck.checked;change()});
  const flag=document.createElement("button");flag.className="flag"+(td.pri?" on":"");flag.textContent="★";flag.title="最優先";flag.setAttribute("aria-label","最優先");
  flag.addEventListener("click",()=>{td.pri=!td.pri;change()});
  const tx=document.createElement("span");tx.className="ttext";tx.contentEditable=true;tx.spellcheck=false;tx.textContent=td.text;
  tx.addEventListener("blur",e=>{td.text=e.target.textContent.trim();markDirty();renderToday()});
  tx.addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();
      td.text=tx.textContent.trim();
      const t={id:id(),text:"",done:false,pri:false,due:""};
      const i=card.todos.indexOf(td);card.todos.splice(i+1,0,t);
      change();
      setTimeout(()=>{const el=document.querySelector('[data-tid="'+t.id+'"] .ttext');if(el)el.focus()},30);
    }
  });
  const due=document.createElement("button");due.className="due"+(td.due?" set":"")+dueClass(td.due);
  due.textContent=td.due?dueLabel(td.due):"期日";
  due.addEventListener("click",()=>openDuePicker(td));
  const x=document.createElement("button");x.className="tdx";x.textContent="×";x.setAttribute("aria-label","TODOを削除");
  x.addEventListener("click",()=>{card.todos=card.todos.filter(t=>t!==td);change()});
  li.append(ck,flag,tx,due,x);
  return li;
}
function elcard(card,col){
  const div=document.createElement("div");div.className="card "+card.status;div.dataset.id=card.id;
  const head=document.createElement("div");head.className="cardhead";
  head.innerHTML='<span class="mname" contenteditable spellcheck="false"></span><button class="pill"></button><button class="xbtn" title="削除" aria-label="カードを削除">&times;</button>';
  const mn=head.querySelector(".mname");mn.textContent=card.name;
  mn.addEventListener("blur",e=>{card.name=e.target.textContent.trim()||"無題";markDirty();renderToday()});
  const pill=head.querySelector(".pill");pill.textContent=SLABEL[card.status];pill.title="タップで状態を切替";
  pill.addEventListener("click",()=>{card.status=STATUSES[(STATUSES.indexOf(card.status)+1)%4];change()});
  head.querySelector(".xbtn").addEventListener("click",()=>{if(confirm("「"+card.name+"」を削除しますか？")){col.cards=col.cards.filter(c=>c!==card);change()}});
  div.appendChild(head);

  const total=card.todos.length, done=card.todos.filter(t=>t.done).length;
  if(total>0){
    const p=document.createElement("div");p.className="prog";
    const i=document.createElement("i");i.style.width=Math.round(done/total*100)+"%";
    p.appendChild(i);div.appendChild(p);
  }

  const ul=document.createElement("ul");ul.className="todos";
  card.todos.filter(t=>!t.done).forEach(td=>ul.appendChild(eltodo(td,card)));
  div.appendChild(ul);

  if(done>0){
    const tg=document.createElement("button");tg.className="donetoggle";
    const open=openDone.has(card.id);
    tg.textContent=(open?"▾":"▸")+" 完了 "+done+"件";
    tg.addEventListener("click",()=>{open?openDone.delete(card.id):openDone.add(card.id);render()});
    div.appendChild(tg);
    if(open){
      const dul=document.createElement("ul");dul.className="todos";
      card.todos.filter(t=>t.done).forEach(td=>dul.appendChild(eltodo(td,card)));
      div.appendChild(dul);
    }
  }

  const add=document.createElement("button");add.className="addtodo";add.textContent="+ TODO";
  add.addEventListener("click",()=>{const t={id:id(),text:"",done:false,pri:false,due:""};card.todos.push(t);change();setTimeout(()=>{const e=document.querySelector('[data-tid="'+t.id+'"] .ttext');if(e)e.focus()},30)});
  div.appendChild(add);
  return div;
}
function elcol(col){
  const sec=document.createElement("section");sec.className="col";sec.dataset.id=col.id;
  const head=document.createElement("div");head.className="colhead";
  head.innerHTML='<span class="colgrip" title="列を移動">&#10303;</span><span class="colname" contenteditable spellcheck="false"></span><span class="ccount"></span><button class="xbtn" title="箱を削除" aria-label="大カテゴリを削除">&times;</button>';
  const cn=head.querySelector(".colname");cn.textContent=col.name;
  cn.addEventListener("blur",e=>{col.name=e.target.textContent.trim()||"無題";markDirty()});
  head.querySelector(".ccount").textContent=col.cards.length;
  head.querySelector(".xbtn").addEventListener("click",()=>{if(confirm("箱「"+col.name+"」を中身ごと削除しますか？")){state.columns=state.columns.filter(c=>c!==col);change()}});
  sec.appendChild(head);
  const list=document.createElement("div");list.className="cardlist";list.dataset.col=col.id;
  col.cards.forEach(card=>list.appendChild(elcard(card,col)));
  sec.appendChild(list);
  const add=document.createElement("button");add.className="addcard";add.textContent="+ プロジェクトを追加";
  add.addEventListener("click",()=>{const c={id:id(),name:"新規プロジェクト",status:"gray",todos:[]};col.cards.push(c);change();setTimeout(()=>{const e=document.querySelector('[data-id="'+c.id+'"] .mname');if(e)e.focus()},30)});
  sec.appendChild(add);
  return sec;
}
function render(){
  const board=$("#board");board.innerHTML="";
  state.columns.forEach(col=>board.appendChild(elcol(col)));
  const addcol=document.createElement("button");addcol.className="addcol";addcol.textContent="＋ 大カテゴリを追加";
  addcol.addEventListener("click",()=>{state.columns.push({id:id(),name:"新規カテゴリ",cards:[]});change()});
  board.appendChild(addcol);
  renderToday();
  renderChips();
  setupDrag();
}

/* ===== due date picker ===== */
let dueTarget=null;
function openDuePicker(td){
  dueTarget=td;
  const inp=$("#dueInput");
  const now=new Date();
  let y=now.getFullYear(), mo=now.getMonth()+1, da=now.getDate();
  const m=(td.due||"").match(/^(\d{1,2})\/(\d{1,2})$/);
  if(m){mo=+m[1];da=+m[2];
    if(mo*100+da < (now.getMonth()+1)*100+now.getDate()-600){y+=1} }
  inp.value=y+"-"+String(mo).padStart(2,"0")+"-"+String(da).padStart(2,"0");
  if(inp.showPicker){try{inp.showPicker()}catch(e){fallbackDue(td)}}
  else fallbackDue(td);
}
function fallbackDue(td){
  const v=prompt("期日（例 7/3、空欄で削除）",td.due||"");
  if(v!==null){td.due=v.trim();change()}
  dueTarget=null;
}
$("#dueInput").addEventListener("change",()=>{
  if(!dueTarget)return;
  const v=$("#dueInput").value;
  if(v){const p=v.split("-");dueTarget.due=(+p[1])+"/"+(+p[2])}
  change();dueTarget=null;
});

/* ===== drag ===== */
let boardSortable=null, cardSortables=[];
function setupDrag(){
  if(boardSortable){try{boardSortable.destroy()}catch(e){}boardSortable=null}
  cardSortables.forEach(s=>{try{s.destroy()}catch(e){}});cardSortables=[];
  const board=$("#board");
  boardSortable=new Sortable(board,{group:"cols",draggable:".col",handle:".colgrip",animation:150,ghostClass:"sortghost",chosenClass:"sortchosen",onEnd:syncColsFromDOM});
  document.querySelectorAll(".cardlist").forEach(list=>{
    cardSortables.push(new Sortable(list,{group:"cards",draggable:".card",animation:150,
      delay:180,delayOnTouchOnly:true,touchStartThreshold:6,
      filter:".ttext,.mname,input,button,.pill,.due,.flag,.tdx,.xbtn,.addtodo,.donetoggle",preventOnFilter:false,
      ghostClass:"sortghost",chosenClass:"sortchosen",onEnd:syncFromDOM}));
  });
}
function syncColsFromDOM(){
  const map={};state.columns.forEach(c=>map[c.id]=c);
  const order=[...$("#board").querySelectorAll(":scope > .col")].map(el=>map[el.dataset.id]).filter(Boolean);
  if(order.length===state.columns.length)state.columns=order;
  change();
}
function syncFromDOM(){
  const map={};state.columns.forEach(col=>col.cards.forEach(c=>map[c.id]=c));
  state.columns.forEach(col=>{
    const list=document.querySelector('.cardlist[data-col="'+col.id+'"]');
    if(!list)return;
    col.cards=[...list.querySelectorAll(".card")].map(el=>map[el.dataset.id]).filter(Boolean);
  });
  change();
}

/* ===== boot ===== */
async function init(){
  const d=new Date();const w=["日","月","火","水","木","金","土"][d.getDay()];
  $("#hdrDate").textContent=(d.getMonth()+1)+"/"+d.getDate()+"（"+w+"）";
  let vault=null;
  try{vault=await ghGetVault(false)}catch(e){}
  if(vault){
    isNew=false;
    $("#lockTitle").textContent="ロック中";
    $("#lockDesc").textContent="合言葉を入力して開いてください。";
  }else{
    isNew=true;
    $("#lockTitle").textContent="初期設定";
    $("#lockDesc").textContent="初回設定です。合言葉を決め、GitHubトークンを貼り付けてください。";
    $("#pass2Wrap").classList.remove("hidden");
    $("#tokenWrap").classList.remove("hidden");
    $("#tokenHint").innerHTML="トークンは GitHub の Settings → Developer settings → Fine-grained tokens で発行（このリポジトリの <b>Contents: Read and write</b>）。合言葉で暗号化して保存します。";
  }
  $("#unlockBtn").addEventListener("click",()=>doUnlock(vault));
  $("#pass").addEventListener("keydown",e=>{if(e.key==="Enter"&&!isNew)doUnlock(vault)});
}
async function doUnlock(vault){
  const err=$("#lockErr");err.textContent="";
  const pass=$("#pass").value;
  if(!pass){err.textContent="合言葉を入力してください。";return}
  $("#unlockBtn").disabled=true;
  try{
    if(isNew){
      if(pass!==$("#pass2").value){err.textContent="合言葉が一致しません。";$("#unlockBtn").disabled=false;return}
      const tk=$("#token").value.trim();
      if(!tk){err.textContent="GitHubトークンを貼り付けてください。";$("#unlockBtn").disabled=false;return}
      SALT=crypto.getRandomValues(new Uint8Array(16));
      KEY=await deriveKey(pass,SALT);
      TOKEN=tk; state=DEFAULT_DATA;
      await ghPutVault(await buildVault());
    }else{
      SALT=b64ToBytes(vault.salt);
      KEY=await deriveKey(pass,SALT);
      try{state=await decStr(KEY,vault.data);TOKEN=await decStr(KEY,vault.token);}
      catch(e){err.textContent="合言葉が違います。";$("#unlockBtn").disabled=false;return}
    }
  }catch(e){err.textContent="エラー: "+e.message;$("#unlockBtn").disabled=false;return}
  $("#lock").classList.add("hidden");
  $("#hdr").classList.remove("hidden");
  $("#todaybar").classList.remove("hidden");
  $("#board").classList.remove("hidden");
  render();
  setStatus("保存済み","ok");
}

$("#refreshBtn").addEventListener("click",async()=>{
  setStatus("取得中…");
  try{const v=await ghGetVault(true);if(v){state=await decStr(KEY,v.data);render();setStatus("最新に更新","ok")}}
  catch(e){setStatus("取得エラー","err")}
});
$("#settingsBtn").addEventListener("click",()=>{$("#mToken").value="";$("#mPass").value="";$("#mErr").textContent="";$("#modal").classList.remove("hidden")});
$("#mCancel").addEventListener("click",()=>$("#modal").classList.add("hidden"));
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")$("#modal").classList.add("hidden")});
$("#mSave").addEventListener("click",async()=>{
  const nt=$("#mToken").value.trim(), np=$("#mPass").value;
  try{
    if(nt)TOKEN=nt;
    if(np){SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await deriveKey(np,SALT);}
    await ghPutVault(await buildVault());
    $("#modal").classList.add("hidden");setStatus("保存済み","ok");
  }catch(e){$("#mErr").textContent="保存失敗: "+e.message}
});

init();
</script>
