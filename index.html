<style>
:root{
  --bg:#F7F6F1;--card:#FFFFFF;--ink:#201F1B;--mut:#787369;--line:#E6E3D9;
  --red:#BE3D2C;--redbg:#F7E4E0;--amber:#9C7A14;--amberbg:#F4ECD3;
  --green:#2F7D4F;--greenbg:#DFEFE3;--gray:#8A8578;--graybg:#EDEBE3;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;
  --serif:"Zen Old Mincho","Hiragino Mincho ProN",serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --shadow:0 1px 2px rgba(32,31,27,.04),0 2px 8px rgba(32,31,27,.04);
  --shadow-lift:0 2px 4px rgba(32,31,27,.06),0 8px 20px rgba(32,31,27,.08);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1A1917;--card:#242320;--ink:#EAE7DF;--mut:#9B968A;--line:#37352E;
  --red:#DD6B57;--redbg:#42221D;--amber:#C9A23F;--amberbg:#3A3115;
  --green:#63B383;--greenbg:#1D3526;--gray:#8F8B80;--graybg:#2E2C27;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 2px 8px rgba(0,0,0,.2);
  --shadow-lift:0 2px 4px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.35);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100dvh}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;touch-action:manipulation}
button{font-family:inherit;cursor:pointer}
button:active{transform:scale(.97)}
.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- lock ---- */
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);z-index:50}
.lockbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;box-shadow:var(--shadow)}
.lockbox h1{font-family:var(--serif);font-weight:700;font-size:20px;margin:0 0 4px;letter-spacing:.04em}
.lockbox p{font-size:13px;color:var(--mut);margin:0 0 16px}
.lockbox label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.lockbox input{width:100%;height:46px;padding:0 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-family:var(--sans)}
.lockbox textarea{width:100%;min-height:64px;padding:10px 12px;font-size:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical;font-family:var(--mono)}
.btn{width:100%;height:46px;margin-top:16px;border:none;border-radius:10px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:700;letter-spacing:.06em}
.btn.sub{background:transparent;color:var(--mut);border:1px solid var(--line);height:42px;font-weight:400;font-size:13px;margin-top:8px;letter-spacing:0}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
.hint{font-size:12px;color:var(--mut);margin-top:10px;line-height:1.6}

/* ---- masthead ---- */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 18px 9px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mast{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.eyebrow{font-size:10px;letter-spacing:.32em;color:var(--mut);font-weight:500}
.mdate{font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:.05em;white-space:nowrap}
header .grow{flex:1}
.status{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:4px;white-space:nowrap}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gray)}
.status.dirty::before{background:var(--amber)}.status.ok::before{background:var(--green)}.status.err::before{background:var(--red)}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;min-height:36px;min-width:36px;padding:0 11px;font-size:13px;transition:border-color .15s}
.iconbtn:hover{border-color:var(--mut)}

/* ---- board ---- */
#board{display:flex;gap:26px;padding:20px 18px calc(48px + env(safe-area-inset-bottom));overflow-x:auto;align-items:flex-start}
.col{width:292px;flex:0 0 292px;border-radius:4px;transition:opacity .25s,filter .25s}
.col.off{opacity:.5;filter:grayscale(.9)}
.colhead{display:flex;align-items:center;gap:5px;margin:0 0 2px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.colgrip{cursor:grab;color:var(--mut);opacity:.4;font-size:15px;flex:none;padding:5px 3px;touch-action:none;border-radius:6px}
.colgrip:active{cursor:grabbing}
.colname{flex:1;font-family:var(--serif);font-size:16.5px;font-weight:700;color:var(--ink);outline:none;border-radius:5px;padding:3px 4px;min-width:0;letter-spacing:.03em;line-height:1.35}
.colname:focus{background:var(--card)}
.ccount{font-family:var(--mono);font-size:11px;color:var(--mut);flex:none;padding:0 2px}
.xbtn{border:none;background:transparent;color:var(--mut);font-size:15px;line-height:1;padding:7px;border-radius:8px;opacity:.45;flex:none}
.xbtn:hover{opacity:1;color:var(--red)}
.cardlist{min-height:30px;border-radius:10px;padding-top:12px}
.cardlist:empty{border:1px dashed var(--line);min-height:56px;position:relative;margin-top:12px;padding-top:0}
.cardlist:empty::after{content:"ここにドラッグ、または下から追加";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mut);opacity:.7;letter-spacing:.05em}

/* ---- card ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px 9px;margin-bottom:12px;box-shadow:var(--shadow);transition:box-shadow .18s ease-out,transform .18s ease-out,opacity .25s,filter .25s;position:relative}
@media(hover:hover){.card:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}}
.card{touch-action:pan-y}
.card.todayon{border:2px solid var(--red);border-top:4px solid var(--red);box-shadow:var(--shadow-lift)}
.todaychip{flex:none;background:var(--red);color:#FFF;font-size:10px;font-weight:700;letter-spacing:.14em;padding:2px 9px;border-radius:20px;user-select:none}
.card.off{opacity:.5;filter:grayscale(.9);border-color:var(--line);border-top-width:1px;background:transparent;box-shadow:none}
@media(hover:hover){.card.off:hover{transform:none;box-shadow:none}}
.cardhead{display:flex;align-items:center;gap:6px}
.mname{flex:1;font-size:14.5px;font-weight:700;outline:none;border-radius:6px;padding:4px;min-width:0;letter-spacing:.01em}
.mname:focus{background:var(--bg)}
.switch{flex:none;width:30px;height:18px;border-radius:20px;border:none;background:var(--ink);position:relative;padding:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:14px;width:14px;height:14px;border-radius:50%;background:var(--card);transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.off .switch{background:var(--graybg)}
.off .switch::after{left:2px}
.colhead .switch{filter:none}
.stamp{position:absolute;top:8px;right:44px;width:34px;height:34px;border:2px solid var(--red);border-radius:50%;color:var(--red);font-family:var(--serif);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);opacity:.62;pointer-events:none}
.stamp.mini{position:static;width:24px;height:24px;font-size:12px;border-width:1.5px;flex:none;margin-right:2px}
@keyframes stampin{0%{transform:rotate(-8deg) scale(1.6);opacity:0}55%{transform:rotate(-8deg) scale(.94);opacity:.7}100%{transform:rotate(-8deg) scale(1);opacity:.62}}
.stamp.stampin{animation:stampin .3s ease-out}
.confirmbar{background:var(--redbg);border-radius:8px;padding:8px 10px;margin-top:9px;font-size:12px;color:var(--red);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.confirmbar .q{font-weight:700;flex:1;min-width:0}
.cbyes{background:var(--red);color:#FFF;border:none;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:500;min-height:32px}
.cbno{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 12px;font-size:12px;min-height:32px}
.colconfirm{margin:10px 0 2px}
.prog{height:2px;border-radius:1px;background:var(--line);margin:7px 0 3px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--green);border-radius:1px;transition:width .25s ease-out}
.todos{list-style:none;margin:4px 0 0;padding:0}
.td{display:flex;align-items:center;gap:6px;font-size:13.5px;padding:2px 0;min-height:38px}
.ck{flex:none;width:18px;height:18px;cursor:pointer;accent-color:var(--green)}
.ttext{flex:1;outline:none;border-radius:6px;padding:4px;word-break:break-word;min-width:0}
.ttext:focus{background:var(--bg)}
.ttext:empty::before{content:"やることを入力…";color:var(--mut);opacity:.55}
.td.done .ttext{color:var(--mut);text-decoration:line-through}
.flag{flex:none;font-size:14px;color:var(--line);user-select:none;border:none;background:transparent;padding:6px 3px;transition:color .15s}
.flag.on{color:var(--red)}
.due{font-family:var(--mono);font-size:10.5px;color:var(--mut);white-space:nowrap;border:1px dashed var(--line);border-radius:7px;padding:4px 7px;background:transparent;flex:none}
.due.set{border-style:solid}
.due.today{color:var(--amber);border-color:var(--amber);font-weight:500}
.due.over{color:var(--red);border-color:var(--red);font-weight:500}
.tdx{flex:none;border:none;background:transparent;color:var(--mut);opacity:.35;font-size:14px;padding:7px 5px}
.tdx:hover{opacity:1;color:var(--red)}
.donetoggle{margin-top:4px;font-size:11.5px;color:var(--mut);background:transparent;border:none;padding:5px 4px;border-radius:6px;text-align:left}
.donetoggle:hover{background:var(--bg)}
.cardfoot{display:flex;gap:6px;align-items:center;margin-top:4px}
.addtodo{flex:1;font-size:12.5px;color:var(--mut);background:transparent;border:none;border-radius:8px;padding:7px 4px;min-height:38px;text-align:left;transition:color .15s}
.addtodo:hover{color:var(--ink)}
.todaybtn{flex:none;font-size:11.5px;border:1px solid var(--line);border-radius:20px;padding:5px 12px;background:transparent;color:var(--mut);white-space:nowrap;min-height:32px;transition:color .15s,border-color .15s,background .15s}
.todaybtn.on{border-color:var(--red);color:var(--red);background:var(--redbg);font-weight:500}
.addcard{width:100%;margin-top:0;font-size:12.5px;color:var(--mut);background:transparent;border:none;border-radius:8px;padding:9px 4px;text-align:left;min-height:40px;transition:color .15s}
.addcard:hover{color:var(--ink)}
.addcol{flex:0 0 220px;background:transparent;border:1px dashed var(--line);border-radius:10px;color:var(--mut);font-size:13px;padding:14px;min-height:52px;letter-spacing:.05em}
.sortghost{opacity:.3}
.sortchosen{box-shadow:var(--shadow-lift)}
@keyframes cardflash{0%,100%{background:var(--card)}40%{background:var(--amberbg)}}
.flash{animation:cardflash 1.1s ease-out 2}

/* ---- modal ---- */
#modal{position:fixed;inset:0;background:rgba(24,23,20,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
.modalbox{width:100%;max-width:400px;background:var(--card);border-radius:14px;padding:22px;box-shadow:var(--shadow-lift);max-height:86dvh;overflow-y:auto}
.modalbox h2{font-family:var(--serif);font-size:17px;margin:0 0 12px;letter-spacing:.04em}
.modalbox h3{font-size:12px;color:var(--mut);margin:18px 0 4px;font-weight:700;letter-spacing:.1em}
.modalbox label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.modalbox input{width:100%;height:44px;padding:0 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-family:var(--sans)}
.modalbox .row{display:flex;gap:8px;margin-top:16px}
.modalbox .row .btn{margin-top:0}
.archrow{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 0;border-top:1px solid var(--line)}
.archrow:first-child{border-top:none}
.archname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.archtag{font-size:10.5px;color:var(--mut);border:1px solid var(--line);border-radius:20px;padding:1px 8px;white-space:nowrap;flex:none}
.restore{border:1px solid var(--line);background:transparent;border-radius:7px;padding:5px 11px;font-size:12px;color:var(--ink);min-height:32px;flex:none}
.restore:hover{border-color:var(--mut)}
.archnone{font-size:12.5px;color:var(--mut);padding:6px 0}
#dueInput{position:fixed;opacity:0;pointer-events:none;width:1px;height:1px;left:-9999px}

/* ---- mobile ---- */
@media(max-width:640px){
  header{padding-left:14px;padding-right:12px}
  .mdate{font-size:17px}
  #board{flex-direction:column;overflow-x:visible;gap:30px;padding:18px 12px calc(48px + env(safe-area-inset-bottom))}
  .col{width:100%;flex:none}
  .addcol{flex:none;width:100%}
  .colname{font-size:18px}
  .mname{font-size:16px}
  .ttext{font-size:16px}
  .td{min-height:44px}
  .due{font-size:11.5px;padding:5px 8px}
}
</style>
</head>
<body>

<div id="lock">
  <div class="lockbox">
    <h1 id="lockTitle">ロック中</h1>
    <p id="lockDesc">合言葉を入力してください。</p>
    <div id="passWrap">
      <label>合言葉（パスフレーズ）</label>
      <input id="pass" type="password" autocomplete="off" inputmode="text">
    </div>
    <div id="pass2Wrap" class="hidden">
      <label>合言葉（確認のためもう一度）</label>
      <input id="pass2" type="password" autocomplete="off">
    </div>
    <div id="tokenWrap" class="hidden">
      <label>GitHub アクセストークン（初回のみ）</label>
      <textarea id="token" placeholder="github_pat_..."></textarea>
      <div class="hint" id="tokenHint"></div>
    </div>
    <button class="btn" id="unlockBtn">開く</button>
    <div class="err" id="lockErr"></div>
  </div>
</div>

<header class="hidden" id="hdr">
  <div class="mast">
    <span class="eyebrow">タスク表</span>
    <span class="mdate" id="hdrDate"></span>
  </div>
  <span class="grow"></span>
  <span class="status" id="status"></span>
  <button class="iconbtn" id="refreshBtn" title="最新を取得" aria-label="最新を取得">&#8635;</button>
  <button class="iconbtn" id="settingsBtn" aria-label="設定">設定</button>
</header>

<div id="board" class="hidden"></div>
<input type="date" id="dueInput" tabindex="-1" aria-hidden="true">

<div id="modal" class="hidden">
  <div class="modalbox">
    <h2>設定</h2>
    <label>GitHub アクセストークン（更新する場合のみ入力）</label>
    <input id="mToken" type="password" placeholder="変更しない場合は空のまま">
    <label>合言葉を変更（新しい合言葉。空なら変更なし）</label>
    <input id="mPass" type="password" placeholder="変更しない場合は空のまま">
    <h3>アーカイブ</h3>
    <div id="archList"></div>
    <div class="row">
      <button class="btn sub" id="mCancel" style="margin-top:0">閉じる</button>
      <button class="btn" id="mSave">保存</button>
    </div>
    <div class="err" id="mErr"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js"></script>
<script>
const REPO="yuida-spec/dashboard";
const API="https://api.github.com/repos/"+REPO;
const ITER=150000;

function id(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function $(s){return document.querySelector(s)}

const DEFAULT_DATA={columns:[
 {id:id(),name:"エイトハンドレッド / マクロミル",cards:[
   {id:id(),name:"マクロミル営業改革",status:"amber",todos:[
     {id:id(),text:"佐々木社長向けたたき台を仕上げる",done:false,pri:true,due:"7/3"},
     {id:id(),text:"関与50%・月250万フィーの条件を文面で確認",done:false,pri:false,due:""}]}]},
 {id:id(),name:"AIコンサル",cards:[
   {id:id(),name:"ダスキン",status:"green",todos:[{id:id(),text:"提案書ドラフトを送付",done:false,pri:false,due:""}]},
   {id:id(),name:"大善",status:"green",todos:[{id:id(),text:"次回ミーティングの日程調整",done:false,pri:false,due:""}]},
   {id:id(),name:"宣伝会議",status:"green",todos:[{id:id(),text:"請求書を発行",done:false,pri:false,due:""}]},
   {id:id(),name:"PEAK",status:"green",todos:[{id:id(),text:"月次レポートを共有",done:false,pri:false,due:""}]}]},
 {id:id(),name:"サンダー",cards:[
   {id:id(),name:"インフ",status:"green",todos:[{id:id(),text:"要件ヒアリングを実施",done:false,pri:false,due:""}]}]},
 {id:id(),name:"LMC",cards:[
   {id:id(),name:"マクアケ",status:"amber",todos:[{id:id(),text:"ページ構成案を作る",done:false,pri:true,due:""}]},
   {id:id(),name:"アフィリエイト",status:"amber",todos:[{id:id(),text:"ASPを選定",done:false,pri:false,due:""}]},
   {id:id(),name:"ビジネスケース",status:"green",todos:[{id:id(),text:"数値モデルを更新",done:false,pri:false,due:""}]}]}
]};

let state=null, KEY=null, TOKEN=null, SALT=null, SHA=null, saveTimer=null, isNew=false;
const openDone=new Set();
let justStamped=null, pendingArchive=null, pendingArchiveCol=null;

/* ===== crypto & sync (unchanged, tested) ===== */
function bytesToB64(bytes){let s="";for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s)}
function b64ToBytes(b64){const s=atob(b64.replace(/\s/g,""));const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function strToB64(str){return bytesToB64(new TextEncoder().encode(str))}
function b64ToStr(b64){return new TextDecoder().decode(b64ToBytes(b64))}
async function deriveKey(pass,salt){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function encStr(key,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj))));
  return bytesToB64(iv)+"."+bytesToB64(ct);
}
async function decStr(key,str){
  const p=str.split(".");
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBytes(p[0])},key,b64ToBytes(p[1]));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function ghGetVault(auth){
  const h={"Accept":"application/vnd.github+json"};
  if(auth&&TOKEN)h["Authorization"]="Bearer "+TOKEN;
  const r=await fetch(API+"/contents/vault.json?ref=main&t="+Date.now(),{headers:h,cache:"no-store"});
  if(r.status===404)return null;
  if(!r.ok)throw new Error("読込失敗("+r.status+")");
  const j=await r.json();
  SHA=j.sha;
  return JSON.parse(b64ToStr(j.content));
}
async function putRaw(vault){
  const body={message:"update dashboard",content:strToB64(JSON.stringify(vault)),branch:"main"};
  if(SHA)body.sha=SHA;
  return fetch(API+"/contents/vault.json",{method:"PUT",headers:{"Authorization":"Bearer "+TOKEN,"Accept":"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
}
async function ghPutVault(vault){
  let r=await putRaw(vault);
  if(r.status===409){await ghGetVault(true);r=await putRaw(vault);}
  if(!r.ok){let m="";try{m=(await r.json()).message||""}catch(e){} throw new Error("保存失敗("+r.status+") "+m)}
  SHA=(await r.json()).content.sha;
}
async function buildVault(){
  return {salt:bytesToB64(SALT), data:await encStr(KEY,state), token:await encStr(KEY,TOKEN)};
}
function setStatus(t,cls){const s=$("#status");s.textContent=t;s.className="status"+(cls?" "+cls:"")}
function markDirty(){setStatus("未保存","dirty");clearTimeout(saveTimer);saveTimer=setTimeout(save,1400)}
async function save(){
  if(!KEY||!TOKEN)return;
  setStatus("保存中…");
  try{await ghPutVault(await buildVault());setStatus("保存済み","ok")}
  catch(e){setStatus("保存エラー","err");console.error(e);alert("保存に失敗しました: "+e.message)}
}

/* ===== dates ===== */
function todayMD(){const d=new Date();return [d.getMonth()+1,d.getDate()]}
function todayStr(){const t=todayMD();return t[0]+"/"+t[1]}
function dueCmp(due){
  if(!due)return null;const m=due.match(/^(\d{1,2})\/(\d{1,2})$/);if(!m)return null;
  const t=todayMD();const a=(+m[1])*100+(+m[2]);const b=t[0]*100+t[1];
  return a<b?-1:(a===b?0:1);
}
function dueClass(due){const c=dueCmp(due);return c===-1?" over":(c===0?" today":"")}
function dueLabel(due){const c=dueCmp(due);if(c===-1)return due+" 期限切れ";if(c===0)return due+" 今日";return due}
function isTodayFlag(v){return v===todayStr()}

function change(){render();markDirty()}
function visibleCols(){return state.columns.filter(c=>!c.archived)}
function isHiddenCol(col){return col.archived||col.off}

/* ===== confirm bars ===== */
function confirmBar(question,onYes,onNo){
  const bar=document.createElement("div");bar.className="confirmbar";
  const q=document.createElement("span");q.className="q";q.textContent=question;
  const yes=document.createElement("button");yes.className="cbyes";yes.textContent="アーカイブ";
  const no=document.createElement("button");no.className="cbno";no.textContent="いいえ、再開";
  yes.addEventListener("click",onYes);
  no.addEventListener("click",onNo);
  bar.append(q,yes,no);
  return bar;
}

/* ===== board rendering ===== */
function eltodo(td,card){
  const li=document.createElement("li");li.className="td"+(td.done?" done":"");li.dataset.tid=td.id;
  const ck=document.createElement("input");ck.type="checkbox";ck.className="ck";ck.checked=td.done;ck.setAttribute("aria-label","完了");
  ck.addEventListener("change",()=>{td.done=ck.checked;change()});
  const flag=document.createElement("button");flag.className="flag"+(td.pri?" on":"");flag.textContent="★";flag.title="最優先";flag.setAttribute("aria-label","最優先");
  flag.addEventListener("click",()=>{td.pri=!td.pri;change()});
  const tx=document.createElement("span");tx.className="ttext";tx.contentEditable=true;tx.spellcheck=false;tx.textContent=td.text;
  tx.addEventListener("blur",e=>{td.text=e.target.textContent.trim();markDirty()});
  tx.addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();
      td.text=tx.textContent.trim();
      const t={id:id(),text:"",done:false,pri:false,due:""};
      const i=card.todos.indexOf(td);card.todos.splice(i+1,0,t);
      change();
      setTimeout(()=>{const el=document.querySelector('[data-tid="'+t.id+'"] .ttext');if(el)el.focus()},30);
    }
  });
  const due=document.createElement("button");due.className="due"+(td.due?" set":"")+dueClass(td.due);
  due.textContent=td.due?dueLabel(td.due):"期日";
  due.addEventListener("click",()=>openDuePicker(td));
  const x=document.createElement("button");x.className="tdx";x.textContent="×";x.setAttribute("aria-label","TODOを削除");
  x.addEventListener("click",()=>{card.todos=card.todos.filter(t=>t!==td);change()});
  li.append(ck,flag,tx,due,x);
  return li;
}
function elcard(card,col){
  const todayOn=isTodayFlag(card.today)&&!card.off&&!col.off;
  const div=document.createElement("div");div.className="card"+(card.off?" off":"")+(todayOn?" todayon":"");div.dataset.id=card.id;
  const head=document.createElement("div");head.className="cardhead";
  head.innerHTML=(todayOn?'<span class="todaychip">今日</span>':'')+'<span class="mname" contenteditable spellcheck="false"></span><button class="switch" role="switch"></button><button class="xbtn" title="削除" aria-label="カードを削除">&times;</button>';
  const mn=head.querySelector(".mname");mn.textContent=card.name;
  mn.addEventListener("blur",e=>{card.name=e.target.textContent.trim()||"無題";markDirty()});
  const sw=head.querySelector(".switch");
  sw.title=card.off?"もう一度押すとアーカイブ確認":"休止する（今はほっとく）";
  sw.setAttribute("aria-checked",card.off?"false":"true");
  sw.setAttribute("aria-label",card.off?"アーカイブ確認":"休止する");
  sw.addEventListener("click",()=>{
    if(!card.off){justStamped=card.id;card.off=true;change();return}
    if(pendingArchive===card.id){pendingArchive=null;card.off=false;change();return}
    pendingArchive=card.id;render();
  });
  head.querySelector(".xbtn").addEventListener("click",()=>{if(confirm("「"+card.name+"」を削除しますか？（アーカイブは残りません）")){col.cards=col.cards.filter(c=>c!==card);change()}});
  div.appendChild(head);
  if(card.off){
    const st=document.createElement("span");st.className="stamp";st.textContent="休";st.setAttribute("aria-hidden","true");
    if(justStamped===card.id){st.classList.add("stampin");justStamped=null}
    div.appendChild(st);
  }
  if(pendingArchive===card.id){
    div.appendChild(confirmBar("「"+card.name+"」をアーカイブしますか？",
      ()=>{card.archived=true;card.off=false;pendingArchive=null;change()},
      ()=>{card.off=false;pendingArchive=null;change()}));
  }

  const total=card.todos.length, done=card.todos.filter(t=>t.done).length;
  if(total>0&&!card.off){
    const p=document.createElement("div");p.className="prog";
    const i=document.createElement("i");i.style.width=Math.round(done/total*100)+"%";
    p.appendChild(i);div.appendChild(p);
  }

  const ul=document.createElement("ul");ul.className="todos";
  card.todos.filter(t=>!t.done).forEach(td=>ul.appendChild(eltodo(td,card)));
  div.appendChild(ul);

  if(done>0){
    const tg=document.createElement("button");tg.className="donetoggle";
    const open=openDone.has(card.id);
    tg.textContent=(open?"▾":"▸")+" 完了 "+done+"件";
    tg.addEventListener("click",()=>{open?openDone.delete(card.id):openDone.add(card.id);render()});
    div.appendChild(tg);
    if(open){
      const dul=document.createElement("ul");dul.className="todos";
      card.todos.filter(t=>t.done).forEach(td=>dul.appendChild(eltodo(td,card)));
      div.appendChild(dul);
    }
  }

  const foot=document.createElement("div");foot.className="cardfoot";
  const add=document.createElement("button");add.className="addtodo";add.textContent="＋ TODO";
  add.addEventListener("click",()=>{const t={id:id(),text:"",done:false,pri:false,due:""};card.todos.push(t);change();setTimeout(()=>{const e=document.querySelector('[data-tid="'+t.id+'"] .ttext');if(e)e.focus()},30)});
  foot.appendChild(add);
  if(!card.off&&!col.off){
    const on=isTodayFlag(card.today);
    const tb=document.createElement("button");tb.className="todaybtn"+(on?" on":"");
    tb.textContent=on?"★ 今日やる":"今日やる";
    tb.title=on?"今日やることから外す":"今日やること欄に載せる";
    tb.addEventListener("click",()=>{card.today=on?"":todayStr();change()});
    foot.appendChild(tb);
  }
  div.appendChild(foot);
  return div;
}
function elcol(col){
  const sec=document.createElement("section");sec.className="col"+(col.off?" off":"");sec.dataset.id=col.id;
  const head=document.createElement("div");head.className="colhead";
  head.innerHTML='<span class="colgrip" title="列を移動">&#10303;</span><span class="colname" contenteditable spellcheck="false"></span><span class="ccount"></span><button class="switch" role="switch"></button><button class="xbtn" title="箱を削除" aria-label="大カテゴリを削除">&times;</button>';
  const cn=head.querySelector(".colname");cn.textContent=col.name;
  cn.addEventListener("blur",e=>{col.name=e.target.textContent.trim()||"無題";markDirty()});
  const liveCards=col.cards.filter(c=>!c.archived);
  head.querySelector(".ccount").textContent=liveCards.length;
  if(col.off){
    const st=document.createElement("span");st.className="stamp mini";st.textContent="休";st.setAttribute("aria-hidden","true");
    head.insertBefore(st,head.querySelector(".switch"));
  }
  const sw=head.querySelector(".switch");
  sw.title=col.off?"もう一度押すとアーカイブ確認":"カテゴリごと休止する";
  sw.setAttribute("aria-checked",col.off?"false":"true");
  sw.setAttribute("aria-label",col.off?"アーカイブ確認":"休止する");
  sw.addEventListener("click",()=>{
    if(!col.off){col.off=true;change();return}
    if(pendingArchiveCol===col.id){pendingArchiveCol=null;col.off=false;change();return}
    pendingArchiveCol=col.id;render();
  });
  head.querySelector(".xbtn").addEventListener("click",()=>{if(confirm("箱「"+col.name+"」を中身ごと削除しますか？（アーカイブは残りません）")){state.columns=state.columns.filter(c=>c!==col);change()}});
  sec.appendChild(head);
  if(pendingArchiveCol===col.id){
    const cb=confirmBar("「"+col.name+"」を中身ごとアーカイブしますか？",
      ()=>{col.archived=true;col.off=false;pendingArchiveCol=null;change()},
      ()=>{col.off=false;pendingArchiveCol=null;change()});
    cb.classList.add("colconfirm");
    sec.appendChild(cb);
  }
  const list=document.createElement("div");list.className="cardlist";list.dataset.col=col.id;
  liveCards.forEach(card=>list.appendChild(elcard(card,col)));
  sec.appendChild(list);
  const add=document.createElement("button");add.className="addcard";add.textContent="＋ プロジェクト";
  add.addEventListener("click",()=>{const c={id:id(),name:"新規プロジェクト",status:"gray",todos:[]};col.cards.push(c);change();setTimeout(()=>{const e=document.querySelector('[data-id="'+c.id+'"] .mname');if(e)e.focus()},30)});
  sec.appendChild(add);
  return sec;
}
function render(){
  const board=$("#board");board.innerHTML="";
  visibleCols().forEach(col=>board.appendChild(elcol(col)));
  const addcol=document.createElement("button");addcol.className="addcol";addcol.textContent="＋ 大カテゴリ";
  addcol.addEventListener("click",()=>{state.columns.push({id:id(),name:"新規カテゴリ",cards:[]});change()});
  board.appendChild(addcol);
  setupDrag();
}

/* ===== due date picker ===== */
let dueTarget=null;
function openDuePicker(td){
  dueTarget=td;
  const inp=$("#dueInput");
  const now=new Date();
  let y=now.getFullYear(), mo=now.getMonth()+1, da=now.getDate();
  const m=(td.due||"").match(/^(\d{1,2})\/(\d{1,2})$/);
  if(m){mo=+m[1];da=+m[2];
    if(mo*100+da < (now.getMonth()+1)*100+now.getDate()-600){y+=1} }
  inp.value=y+"-"+String(mo).padStart(2,"0")+"-"+String(da).padStart(2,"0");
  if(inp.showPicker){try{inp.showPicker()}catch(e){fallbackDue(td)}}
  else fallbackDue(td);
}
function fallbackDue(td){
  const v=prompt("期日（例 7/3、空欄で削除）",td.due||"");
  if(v!==null){td.due=v.trim();change()}
  dueTarget=null;
}
$("#dueInput").addEventListener("change",()=>{
  if(!dueTarget)return;
  const v=$("#dueInput").value;
  if(v){const p=v.split("-");dueTarget.due=(+p[1])+"/"+(+p[2])}
  change();dueTarget=null;
});

/* ===== drag ===== */
let boardSortable=null, cardSortables=[];
function setupDrag(){
  if(boardSortable){try{boardSortable.destroy()}catch(e){}boardSortable=null}
  cardSortables.forEach(s=>{try{s.destroy()}catch(e){}});cardSortables=[];
  const board=$("#board");
  boardSortable=new Sortable(board,{group:"cols",draggable:".col",handle:".colgrip",animation:150,ghostClass:"sortghost",chosenClass:"sortchosen",onEnd:syncColsFromDOM});
  document.querySelectorAll(".cardlist").forEach(list=>{
    cardSortables.push(new Sortable(list,{group:"cards",draggable:".card",animation:150,
      delay:180,delayOnTouchOnly:true,touchStartThreshold:6,
      filter:".ttext,.mname,input,button,.due,.flag,.tdx,.xbtn,.addtodo,.donetoggle,.switch,.todaybtn,.cbyes,.cbno",preventOnFilter:false,
      ghostClass:"sortghost",chosenClass:"sortchosen",onEnd:syncFromDOM}));
  });
}
function syncColsFromDOM(){
  const map={};state.columns.forEach(c=>map[c.id]=c);
  const archived=state.columns.filter(c=>c.archived);
  const order=[...$("#board").querySelectorAll(":scope > .col")].map(el=>map[el.dataset.id]).filter(Boolean);
  if(order.length===visibleCols().length)state.columns=order.concat(archived);
  change();
}
function syncFromDOM(){
  const map={};state.columns.forEach(col=>col.cards.forEach(c=>map[c.id]=c));
  const archivedByCol=state.columns.map(col=>col.cards.filter(c=>c.archived));
  state.columns.forEach((col,i)=>{
    const list=document.querySelector('.cardlist[data-col="'+col.id+'"]');
    if(!list)return;
    col.cards=[...list.querySelectorAll(".card")].map(el=>map[el.dataset.id]).filter(Boolean).concat(archivedByCol[i]);
  });
  change();
}

/* ===== archive list (settings) ===== */
function renderArchive(){
  const box=$("#archList");box.innerHTML="";
  let any=false;
  state.columns.forEach(col=>{
    if(!col.archived)return;
    any=true;
    const row=document.createElement("div");row.className="archrow";
    const nm=document.createElement("span");nm.className="archname";nm.textContent=col.name;
    const tag=document.createElement("span");tag.className="archtag";tag.textContent="大カテゴリ・"+col.cards.length+"件";
    const rs=document.createElement("button");rs.className="restore";rs.textContent="復元";
    rs.addEventListener("click",()=>{col.archived=false;change();renderArchive()});
    row.append(nm,tag,rs);box.appendChild(row);
  });
  state.columns.forEach(col=>{
    col.cards.forEach(card=>{
      if(!card.archived)return;
      any=true;
      const row=document.createElement("div");row.className="archrow";
      const nm=document.createElement("span");nm.className="archname";nm.textContent=card.name;
      const tag=document.createElement("span");tag.className="archtag";tag.textContent=col.name;
      const rs=document.createElement("button");rs.className="restore";rs.textContent="復元";
      rs.addEventListener("click",()=>{card.archived=false;if(col.archived)col.archived=false;change();renderArchive()});
      row.append(nm,tag,rs);box.appendChild(row);
    });
  });
  if(!any){const n=document.createElement("div");n.className="archnone";n.textContent="アーカイブはありません。";box.appendChild(n)}
}

/* ===== boot ===== */
async function init(){
  const d=new Date();const w=["日","月","火","水","木","金","土"][d.getDay()];
  $("#hdrDate").textContent=(d.getMonth()+1)+"月"+d.getDate()+"日（"+w+"）";
  let vault=null;
  try{vault=await ghGetVault(false)}catch(e){}
  if(vault){
    isNew=false;
    $("#lockTitle").textContent="ロック中";
    $("#lockDesc").textContent="合言葉を入力して開いてください。";
  }else{
    isNew=true;
    $("#lockTitle").textContent="初期設定";
    $("#lockDesc").textContent="初回設定です。合言葉を決め、GitHubトークンを貼り付けてください。";
    $("#pass2Wrap").classList.remove("hidden");
    $("#tokenWrap").classList.remove("hidden");
    $("#tokenHint").innerHTML="トークンは GitHub の Settings → Developer settings → Fine-grained tokens で発行（このリポジトリの <b>Contents: Read and write</b>）。合言葉で暗号化して保存します。";
  }
  $("#unlockBtn").addEventListener("click",()=>doUnlock(vault));
  $("#pass").addEventListener("keydown",e=>{if(e.key==="Enter"&&!isNew)doUnlock(vault)});
}
async function doUnlock(vault){
  const err=$("#lockErr");err.textContent="";
  const pass=$("#pass").value;
  if(!pass){err.textContent="合言葉を入力してください。";return}
  $("#unlockBtn").disabled=true;
  try{
    if(isNew){
      if(pass!==$("#pass2").value){err.textContent="合言葉が一致しません。";$("#unlockBtn").disabled=false;return}
      const tk=$("#token").value.trim();
      if(!tk){err.textContent="GitHubトークンを貼り付けてください。";$("#unlockBtn").disabled=false;return}
      SALT=crypto.getRandomValues(new Uint8Array(16));
      KEY=await deriveKey(pass,SALT);
      TOKEN=tk; state=DEFAULT_DATA;
      await ghPutVault(await buildVault());
    }else{
      SALT=b64ToBytes(vault.salt);
      KEY=await deriveKey(pass,SALT);
      try{state=await decStr(KEY,vault.data);TOKEN=await decStr(KEY,vault.token);}
      catch(e){err.textContent="合言葉が違います。";$("#unlockBtn").disabled=false;return}
    }
  }catch(e){err.textContent="エラー: "+e.message;$("#unlockBtn").disabled=false;return}
  $("#lock").classList.add("hidden");
  $("#hdr").classList.remove("hidden");
  $("#board").classList.remove("hidden");
  render();
  setStatus("保存済み","ok");
}

$("#refreshBtn").addEventListener("click",async()=>{
  setStatus("取得中…");
  try{const v=await ghGetVault(true);if(v){state=await decStr(KEY,v.data);render();setStatus("最新に更新","ok")}}
  catch(e){setStatus("取得エラー","err")}
});
$("#settingsBtn").addEventListener("click",()=>{$("#mToken").value="";$("#mPass").value="";$("#mErr").textContent="";renderArchive();$("#modal").classList.remove("hidden")});
$("#mCancel").addEventListener("click",()=>$("#modal").classList.add("hidden"));
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")$("#modal").classList.add("hidden")});
$("#mSave").addEventListener("click",async()=>{
  const nt=$("#mToken").value.trim(), np=$("#mPass").value;
  try{
    if(nt)TOKEN=nt;
    if(np){SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await deriveKey(np,SALT);}
    await ghPutVault(await buildVault());
    $("#modal").classList.add("hidden");setStatus("保存済み","ok");
  }catch(e){$("#mErr").textContent="保存失敗: "+e.message}
});

init();
</script>
